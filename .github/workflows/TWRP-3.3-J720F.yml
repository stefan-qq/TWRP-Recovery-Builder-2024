name: Build J720F donor-era TWRP 3.3

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE:
        description: J720F device-tree repository
        required: true
        default: https://github.com/stefan-qq/android_device_samsung_j7duolte
      DEVICE_TREE_BRANCH:
        description: Legacy device-tree branch
        required: true
        default: twrp-3.3
      PUBLISH_RELEASE:
        description: Publish a prerelease after audit
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RECOVERY_CUTOFF: '2019-04-18T00:00:00Z'
      DEVICE_PATH: device/samsung/j7duolte
      DEVICE_NAME: j7duolte
      RECOVERY_LIMIT: '39845888'

    steps:
      - name: Check out builder
        uses: actions/checkout@v7

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost /usr/share/swift
          sudo docker system prune -a -f || true
          df -h

      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cpio curl git xz-utils python3

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize and sync donor-era Omni/TWRP base
        shell: bash
        run: |
          set -euxo pipefail

          MANIFEST_URL=https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git

          rm -rf workspace
          mkdir -p workspace
          cd workspace

          selected_branch=""

          for candidate in twrp-7.1 android-7.1; do
            if git ls-remote --exit-code --heads \
                "$MANIFEST_URL" "refs/heads/$candidate" \
                >/dev/null 2>&1; then
              selected_branch="$candidate"
              break
            fi
          done

          if [[ -z "$selected_branch" ]]; then
            echo "No usable Android 7.1 TWRP manifest branch found" >&2
            exit 1
          fi

          echo "Using manifest branch: $selected_branch"
          echo "LEGACY_MANIFEST_BRANCH=$selected_branch" >> "$GITHUB_ENV"

          repo init --depth=1 \
            -u "$MANIFEST_URL" \
            -b "$selected_branch"

          sync_ok=0

          for attempt in 1 2 3; do
            if repo sync \
                -c \
                --force-sync \
                --no-clone-bundle \
                --no-tags \
                -j4; then
              sync_ok=1
              break
            fi

            echo "repo sync attempt $attempt failed" >&2
            sleep 15
          done

          test "$sync_ok" -eq 1
          test -f build/envsetup.sh
          test -d vendor/omni

          df -h

      - name: Verify manifest-matched legacy clang
        shell: bash
        run: |
          set -euxo pipefail
          CLANG_ROOT="workspace/prebuilts/clang/host/linux-x86"
          CLANG_BIN="$CLANG_ROOT/clang-2690385/bin/clang"

          ls -la "$CLANG_ROOT"
          find "$CLANG_ROOT" \
            -maxdepth 3 \
            -type f \
            -name clang \
            -print
          test -x "$CLANG_BIN"

      - name: Select the historical TWRP 3.3 recovery source
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/recovery-source"
          if ! git clone --filter=blob:none --no-checkout \
              https://github.com/omnirom/android_bootable_recovery.git \
              "$RUNNER_TEMP/recovery-source"; then
            git clone --filter=blob:none --no-checkout \
              https://github.com/TeamWin/android_bootable_recovery.git \
              "$RUNNER_TEMP/recovery-source"
          fi
          cd "$RUNNER_TEMP/recovery-source"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' \
            --filter=blob:none --prune

          selected=''
          for ref in \
            refs/remotes/origin/android-8.1 \
            refs/remotes/origin/android-9.0 \
            refs/remotes/origin/master; do
            git rev-parse --verify "$ref" >/dev/null 2>&1 || continue
            while read -r commit; do
              if git show "$commit:variables.h" 2>/dev/null \
                  | grep -Eq '^[[:space:]]*#define[[:space:]]+TW_MAIN_VERSION_STR[[:space:]]+"3\.3\.0"'; then
                selected="$commit"
                break 2
              fi
            done < <(git rev-list --max-count=300 --before="$RECOVERY_CUTOFF" "$ref" -- variables.h)
          done

          test -n "$selected"
          git checkout --detach "$selected"
          grep -Eq '^[[:space:]]*#define[[:space:]]+TW_MAIN_VERSION_STR[[:space:]]+"3\.3\.0"' variables.h
          echo "RECOVERY_SOURCE_COMMIT=$selected" >> "$GITHUB_ENV"

          rm -rf "$GITHUB_WORKSPACE/workspace/bootable/recovery"
          mv "$RUNNER_TEMP/recovery-source" \
            "$GITHUB_WORKSPACE/workspace/bootable/recovery"

      - name: Clone the J720F legacy device tree
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "workspace/$DEVICE_PATH"
          git clone --depth=1 --branch "${{ inputs.DEVICE_TREE_BRANCH }}" \
            "${{ inputs.DEVICE_TREE }}" \
            "workspace/$DEVICE_PATH"
          cd "workspace/$DEVICE_PATH"
          echo "DEVICE_TREE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          test ! -e recovery/root/init.rc
          test ! -e recovery/root/init.recovery.service.rc
          test -f recovery/root/init.recovery.samsungexynos7885.rc
          grep -Eq '^[[:space:]]*start[[:space:]]+set_permissive([[:space:]]|$)' \
            recovery/root/init.recovery.samsungexynos7885.rc
          test ! -e recovery/root/sbin/j720f_diag.sh
          grep -q 'TW_USE_NEW_MINADBD := true' BoardConfig.mk
          grep -q 'TW_CRYPTO_USE_SYSTEM_VOLD := true' BoardConfig.mk
          grep -q 'setprop sys.usb.controller 13600000.dwc3' \
            recovery/root/init.recovery.usb.rc
          grep -q 'functions/ffs.adb' \
            recovery/root/init.recovery.usb.rc
          grep -q 'sys.usb.ffs.ready=1.*sys.usb.config=adb' \
            recovery/root/init.recovery.usb.rc
          ! grep -q '/sys/class/android_usb' \
            recovery/root/init.recovery.usb.rc
          ! grep -q 'functions/adb.0' \
            recovery/root/init.recovery.usb.rc
          grep -q 'persist.sys.usb.config=adb' omni_j7duolte.mk
          grep -q 'persist.sys.usb.config=adb' system.prop
          grep -q 'permissive adbd;' sepolicy/recovery.te

      - name: Build source TWRP 3.3 in the donor environment
        shell: bash
        run: |
          set -euxo pipefail
          docker pull yshalsager/lineageos:14.1
          docker run --rm -i \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/twrp-home \
            -e USER="$(id -un)" \
            -e LOGNAME="$(id -un)" \
            -v /etc/passwd:/etc/passwd:ro \
            -v /etc/group:/etc/group:ro \
            -v "$GITHUB_WORKSPACE/workspace:/home/twrp:rw" \
            -w /home/twrp \
            yshalsager/lineageos:14.1 bash <<'EOF'
          set -e
          mkdir -p "$HOME"
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_j7duolte-eng
          make -j"$(nproc)" recoveryimage
          EOF

      - name: Finalize Samsung image and audit
        shell: bash
        run: |
          set -euxo pipefail
          TREE="workspace/$DEVICE_PATH"
          OUT="workspace/out/target/product/$DEVICE_NAME"
          IMAGE="$OUT/recovery.img"

          test -f "$IMAGE"
          python3 "$TREE/tools/finalize_samsung_recovery.py" "$IMAGE"
          python3 "$TREE/tools/audit_recovery.py" "$IMAGE" \
            --tree "$TREE" \
            --out-dir "$OUT/recovery-audit"
          test "$(stat -c %s "$IMAGE")" -le "$RECOVERY_LIMIT"

      - name: Package Heimdall/Odin tar and metadata
        shell: bash
        run: |
          set -euxo pipefail
          OUT="workspace/out/target/product/$DEVICE_NAME"
          (
            cd "$OUT"
            tar -cf recovery.tar recovery.img
          )
          {
            echo 'userspace=donor-era Omni/TWRP'
            echo 'twrp_version=3.3.0-0'
            echo "recovery_source_commit=$RECOVERY_SOURCE_COMMIT"
            echo "device_tree=${{ inputs.DEVICE_TREE }}"
            echo "device_tree_branch=${{ inputs.DEVICE_TREE_BRANCH }}"
            echo "device_tree_commit=$DEVICE_TREE_COMMIT"
          } > "$OUT/build-metadata.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: j7duolte-twrp-3.3-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            workspace/out/target/product/j7duolte/recovery.img
            workspace/out/target/product/j7duolte/recovery.tar
            workspace/out/target/product/j7duolte/build-metadata.txt
            workspace/out/target/product/j7duolte/recovery-audit/**

      - name: Publish GitHub prerelease
        if: ${{ inputs.PUBLISH_RELEASE }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          OUT="workspace/out/target/product/$DEVICE_NAME"
          TAG="j7duolte-twrp-3.3-${{ github.run_id }}"
          gh release create "$TAG" \
            "$OUT/recovery.img" \
            "$OUT/recovery.tar" \
            "$OUT/build-metadata.txt" \
            "$OUT/recovery-audit/audit.json" \
            --repo "$GITHUB_REPOSITORY" \
            --title "J720F donor-era TWRP 3.3 test ${{ github.run_id }}" \
            --notes "Source-built J720F donor-era TWRP 3.3 test image." \
            --prerelease
