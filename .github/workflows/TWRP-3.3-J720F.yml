name: Build J720F TWRP 3.3 trace-readable data diagnostic

on:
  workflow_dispatch:
    inputs:
      DEVICE_TREE:
        description: J720F device-tree repository
        required: true
        default: https://github.com/stefan-qq/android_device_samsung_j7duolte
      DEVICE_TREE_BRANCH:
        description: Device-tree branch to build
        required: true
        default: twrp-3.3-native-ffs-force-ffs-entry
      PUBLISH_RELEASE:
        description: Publish a prerelease after audit
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RECOVERY_SOURCE_REPOSITORY: https://github.com/omnirom/android_bootable_recovery.git
      RECOVERY_SOURCE_COMMIT: b1a7ae9cd98e6ac3377d1fecc1341b9643a4f15b
      DEVICE_PATH: device/samsung/j7duolte
      DEVICE_NAME: j7duolte
      RECOVERY_LIMIT: '39845888'

    steps:
      - name: Check out builder
        uses: actions/checkout@v6

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost /usr/share/swift
          sudo docker system prune -a -f || true
          df -h

      - name: Install host tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cpio curl git lz4 xz-utils python3

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 5 --retry-delay 5 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize and sync donor-era Omni/TWRP base
        shell: bash
        run: |
          set -euxo pipefail
          MANIFEST_URL=https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git
          MANIFEST_BRANCH=twrp-7.1

          git ls-remote --exit-code --heads \
            "$MANIFEST_URL" "refs/heads/$MANIFEST_BRANCH" \
            >/dev/null

          rm -rf workspace
          mkdir -p workspace
          cd workspace

          repo init --depth=1 \
            -u "$MANIFEST_URL" \
            -b "$MANIFEST_BRANCH"

          sync_ok=0
          for attempt in 1 2 3; do
            if repo sync \
                -c \
                --force-sync \
                --no-clone-bundle \
                --no-tags \
                -j4; then
              sync_ok=1
              break
            fi
            echo "repo sync attempt $attempt failed" >&2
            sleep 15
          done

          test "$sync_ok" -eq 1
          test -f build/envsetup.sh
          test -d vendor/omni
          echo "LEGACY_MANIFEST_BRANCH=$MANIFEST_BRANCH" >> "$GITHUB_ENV"
          df -h

      - name: Pin the exact TWRP 3.3 recovery source used by v11
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$RUNNER_TEMP/recovery-source"
          git clone --filter=blob:none --no-checkout \
            "$RECOVERY_SOURCE_REPOSITORY" \
            "$RUNNER_TEMP/recovery-source"
          cd "$RUNNER_TEMP/recovery-source"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' \
            --filter=blob:none --prune
          git cat-file -e "$RECOVERY_SOURCE_COMMIT^{commit}"
          git checkout --detach "$RECOVERY_SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$RECOVERY_SOURCE_COMMIT"
          grep -Eq 'TW_MAIN_VERSION_STR[[:space:]]+"3\.3\.0"' variables.h

          rm -rf "$GITHUB_WORKSPACE/workspace/bootable/recovery"
          mv "$RUNNER_TEMP/recovery-source" \
            "$GITHUB_WORKSPACE/workspace/bootable/recovery"

      - name: Patch legacy TWRP ORS FIFO paths
        shell: bash
        run: |
          set -euxo pipefail
          reject_grep() {
            local label="$1"
            shift
            if grep "$@"; then
              echo "Rejected: $label" >&2
              exit 1
            else
              local status=$?
              if [ "$status" -ne 1 ]; then
                echo "grep failed while checking: $label" >&2
                exit "$status"
              fi
            fi
          }
          ORS_HEADER=workspace/bootable/recovery/orscmd/orscmd.h
          python3 tools/patch_twrp_ors_fifo.py "$ORS_HEADER"
          grep -Fq '#define ORS_INPUT_FILE "/tmp/orsin"' "$ORS_HEADER"
          grep -Fq '#define ORS_OUTPUT_FILE "/tmp/orsout"' "$ORS_HEADER"
          reject_grep 'legacy /sbin ORS input path remains' -Fq '"/sbin/orsin"' "$ORS_HEADER"
          reject_grep 'legacy /sbin ORS output path remains' -Fq '"/sbin/orsout"' "$ORS_HEADER"

      - name: Instrument native adbd, linker and init tracing
        shell: bash
        run: |
          set -euxo pipefail
          reject_grep() {
            local label="$1"
            shift
            if grep "$@"; then
              echo "Rejected: $label" >&2
              exit 1
            else
              local status=$?
              if [ "$status" -ne 1 ]; then
                echo "grep failed while checking: $label" >&2
                exit "$status"
              fi
            fi
          }
          TRACE_DIR=workspace/j720f-build-diagnostics
          SYSTEM_CORE=workspace/system/core
          BIONIC=workspace/bionic
          mkdir -p "$TRACE_DIR"

          SYSTEM_CORE_COMMIT="$(git -C "$SYSTEM_CORE" rev-parse HEAD)"
          SYSTEM_CORE_REMOTE_NAME="$(git -C "$SYSTEM_CORE" remote | head -n 1)"
          test -n "$SYSTEM_CORE_REMOTE_NAME"
          SYSTEM_CORE_REPOSITORY="$(git -C "$SYSTEM_CORE" remote get-url "$SYSTEM_CORE_REMOTE_NAME")"
          echo "SYSTEM_CORE_COMMIT=$SYSTEM_CORE_COMMIT" >> "$GITHUB_ENV"
          echo "SYSTEM_CORE_REPOSITORY=$SYSTEM_CORE_REPOSITORY" >> "$GITHUB_ENV"

          BIONIC_COMMIT="$(git -C "$BIONIC" rev-parse HEAD)"
          BIONIC_REMOTE_NAME="$(git -C "$BIONIC" remote | head -n 1)"
          test -n "$BIONIC_REMOTE_NAME"
          BIONIC_REPOSITORY="$(git -C "$BIONIC" remote get-url "$BIONIC_REMOTE_NAME")"
          echo "BIONIC_COMMIT=$BIONIC_COMMIT" >> "$GITHUB_ENV"
          echo "BIONIC_REPOSITORY=$BIONIC_REPOSITORY" >> "$GITHUB_ENV"

          python3 tools/patch_j720f_adbd_usb_trace.py \
            --system-core "$SYSTEM_CORE" \
            --report "$TRACE_DIR/adbd-trace-patch-report.json"
          python3 tools/patch_j720f_adbd_force_ffs.py \
            --system-core "$SYSTEM_CORE" \
            --report "$TRACE_DIR/adbd-force-ffs-patch-report.json"
          python3 tools/patch_j720f_adbd_recovery_shell.py \
            --system-core "$SYSTEM_CORE" \
            --report "$TRACE_DIR/adbd-recovery-shell-patch-report.json"
          python3 tools/patch_j720f_adbd_pty_exec_transition.py \
            --system-core "$SYSTEM_CORE" \
            --report "$TRACE_DIR/adbd-pty-exec-transition-patch-report.json"
          python3 tools/patch_j720f_adbd_sync_worker.py \
            --system-core "$SYSTEM_CORE" \
            --report "$TRACE_DIR/adbd-sync-worker-patch-report.json"
          python3 tools/patch_j720f_linker_diag.py \
            --bionic "$BIONIC" \
            --report "$TRACE_DIR/linker-diag-patch-report.json"
          python3 tools/patch_j720f_init_udc_trace.py \
            --system-core "$SYSTEM_CORE" \
            --report "$TRACE_DIR/init-udc-trace-patch-report.json"

          git -C "$SYSTEM_CORE" diff --check
          git -C "$BIONIC" diff --check
          git -C "$SYSTEM_CORE" diff -- \
            adb/daemon/main.cpp \
            adb/usb_linux_client.cpp \
            adb/adb_trace.cpp \
            adb/services.cpp \
            adb/shell_service.cpp \
            init/util.cpp \
            > "$TRACE_DIR/system-core-adbd-direct-trace.patch"
          test -s "$TRACE_DIR/system-core-adbd-direct-trace.patch"
          git -C "$BIONIC" diff -- linker/linker.cpp \
            > "$TRACE_DIR/bionic-linker-diag.patch"
          test -s "$TRACE_DIR/bionic-linker-diag.patch"

          cp "$SYSTEM_CORE/adb/daemon/main.cpp" \
            "$TRACE_DIR/adbd-main.cpp.patched"
          cp "$SYSTEM_CORE/adb/usb_linux_client.cpp" \
            "$TRACE_DIR/usb_linux_client.cpp.patched"
          cp "$SYSTEM_CORE/adb/adb_trace.cpp" \
            "$TRACE_DIR/adb_trace.cpp.patched"
          cp "$SYSTEM_CORE/adb/services.cpp" \
            "$TRACE_DIR/services.cpp.patched"
          cp "$SYSTEM_CORE/adb/shell_service.cpp" \
            "$TRACE_DIR/shell_service.cpp.patched"
          cp "$SYSTEM_CORE/init/util.cpp" \
            "$TRACE_DIR/init-util.cpp.patched"
          cp "$BIONIC/linker/linker.cpp" \
            "$TRACE_DIR/linker.cpp.patched"
          printf '%s\n' "$SYSTEM_CORE_COMMIT" \
            > "$TRACE_DIR/system-core-commit.txt"
          printf '%s\n' "$SYSTEM_CORE_REPOSITORY" \
            > "$TRACE_DIR/system-core-repository.txt"
          printf '%s\n' "$BIONIC_COMMIT" \
            > "$TRACE_DIR/bionic-commit.txt"
          printf '%s\n' "$BIONIC_REPOSITORY" \
            > "$TRACE_DIR/bionic-repository.txt"

          grep -Fq 'J720F_MAIN_USB_GATE' \
            "$SYSTEM_CORE/adb/daemon/main.cpp"
          grep -Fq 'J720F_MAIN_USB_DECISION' \
            "$SYSTEM_CORE/adb/daemon/main.cpp"
          grep -Fq '/tmp/J720F_ADBD_USB_TRACE.txt' \
            "$SYSTEM_CORE/adb/usb_linux_client.cpp"
          grep -Fq 'event=usb_init_transport' \
            "$SYSTEM_CORE/adb/usb_linux_client.cpp"
          grep -Fq 'event=usb_init_choice' \
            "$SYSTEM_CORE/adb/usb_linux_client.cpp"
          grep -Fq 'event=v2_descriptor_write' \
            "$SYSTEM_CORE/adb/usb_linux_client.cpp"
          grep -Fq 'event=ffs_ready_property_set' \
            "$SYSTEM_CORE/adb/usb_linux_client.cpp"
          grep -Fq '/tmp/J720F_ADBD_TRACE.txt' \
            "$SYSTEM_CORE/adb/adb_trace.cpp"
          grep -Fq 'J720F_ADB_RECOVERY_CHILD' \
            "$SYSTEM_CORE/adb/shell_service.cpp"
          grep -Fq 'J720F_SHELL_CHILD phase=pre_setcon_recovery' \
            "$SYSTEM_CORE/adb/shell_service.cpp"
          grep -Fq 'J720F_SHELL_CHILD phase=post_setcon_recovery' \
            "$SYSTEM_CORE/adb/shell_service.cpp"
          grep -Fq 'selinux_android_setcon("u:r:recovery:s0")' \
            "$SYSTEM_CORE/adb/shell_service.cpp"
          grep -Fq 'J720F_ADB_PTY_RECOVERY_EXEC' \
            "$SYSTEM_CORE/adb/shell_service.cpp"
          grep -Fq 'setexeccon("u:r:recovery:s0")' \
            "$SYSTEM_CORE/adb/shell_service.cpp"
          grep -Fq 'phase=pty_setexec_recovery_pending' \
            "$SYSTEM_CORE/adb/shell_service.cpp"
          grep -Fq 'post_setexec_recovery_pending' \
            "$SYSTEM_CORE/adb/shell_service.cpp"
          grep -Fq 'J720F_ADB_SYNC_WORKER' \
            "$SYSTEM_CORE/adb/services.cpp"
          grep -Fq 'j720f_recovery_sync_service' \
            "$SYSTEM_CORE/adb/services.cpp"
          grep -Fq 'execve("/sbin/adbd", argv, envp)' \
            "$SYSTEM_CORE/adb/services.cpp"
          grep -Fq 'J720F_ADB_SYNC_FD=3' \
            "$SYSTEM_CORE/adb/services.cpp"
          grep -Fq 'J720F_ADB_SYNC_WORKER phase=entry' \
            "$SYSTEM_CORE/adb/daemon/main.cpp"
          grep -Fq 'file_sync_service(static_cast<int>(parsed_fd), nullptr)' \
            "$SYSTEM_CORE/adb/daemon/main.cpp"
          grep -Fq 'const std::string shell_command = "/sbin/sh";' \
            "$SYSTEM_CORE/adb/shell_service.cpp"
          grep -Fq 'env["LD_LIBRARY_PATH"] = "/sbin"' \
            "$SYSTEM_CORE/adb/shell_service.cpp"
          grep -Fq 'env["SHELL"] = "/sbin/sh"' \
            "$SYSTEM_CORE/adb/shell_service.cpp"
          reject_grep 'superseded shell child setcon remains' -Fq 'selinux_android_setcon("u:r:shell:s0")' "$SYSTEM_CORE/adb/shell_service.cpp"
          reject_grep 'superseded su child setcon remains' -Fq 'selinux_android_setcon("u:r:su:s0")' "$SYSTEM_CORE/adb/shell_service.cpp"
          grep -Fq 'J720F_LINKER_DIAG' \
            "$BIONIC/linker/linker.cpp"
          grep -Fq 'J720F_LINKER_CRED phase=' \
            "$BIONIC/linker/linker.cpp"
          grep -Fq 'after_main_thread' \
            "$BIONIC/linker/linker.cpp"
          grep -Fq 'aux_uid=' \
            "$BIONIC/linker/linker.cpp"
          grep -Fq 'j720f_at_secure' \
            "$BIONIC/linker/linker.cpp"
          grep -Fq 'libc_mmap_exec' \
            "$BIONIC/linker/linker.cpp"
          grep -Fq 'J720F_INIT_UDC' \
            "$SYSTEM_CORE/init/util.cpp"
          grep -Fq 'J720F_UDC_CONTROL' \
            "$SYSTEM_CORE/init/util.cpp"
          grep -Fq 'J720F_UEVENT_SELECTOR' \
            "$SYSTEM_CORE/init/util.cpp"
          grep -Fq 'Function FS Gadget' \
            "$SYSTEM_CORE/init/util.cpp"
          grep -Fq '/sys/kernel/config/usb_gadget/g1/functions/acm.GS0' \
            "$SYSTEM_CORE/init/util.cpp"
          grep -Fq '/sys/kernel/config/usb_gadget/g1/UDC' \
            "$SYSTEM_CORE/init/util.cpp"
          if grep -Fq '/data/adb/adb-' "$SYSTEM_CORE/adb/adb_trace.cpp"; then
            echo 'Old /data ADB trace path remains after instrumentation' >&2
            exit 1
          fi

      - name: Patch donor recovery policy for targeted TWRP data access
        shell: bash
        run: |
          set -euxo pipefail
          TRACE_DIR=workspace/j720f-build-diagnostics
          SEPOLICY=workspace/system/sepolicy

          python3 tools/patch_j720f_recovery_data_policy.py \
            --sepolicy "$SEPOLICY" \
            --report "$TRACE_DIR/recovery-data-policy-patch-report.json"

          git -C "$SEPOLICY" diff --check
          git -C "$SEPOLICY" diff -- \
            recovery.te domain.te \
            > "$TRACE_DIR/system-sepolicy-j720f-data.patch"
          test -s "$TRACE_DIR/system-sepolicy-j720f-data.patch"

          if grep -q '^neverallow recovery data_file_type:' "$SEPOLICY/recovery.te"; then
            echo 'Recovery /data neverallow remains after patch' >&2
            exit 1
          fi
          python3 - "$SEPOLICY/domain.te" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          lines = path.read_text().splitlines()
          end = next(
              (
                  index
                  for index, line in enumerate(lines)
                  if line.strip()
                  == "} system_data_file:file no_w_file_perms;"
              ),
              None,
          )
          if end is None:
              raise SystemExit(
                  "system_data_file write neverallow not found"
              )

          start = end
          while start >= 0 and lines[start].strip() != "neverallow {":
              start -= 1
          if start < 0:
              raise SystemExit(
                  "start of system_data_file neverallow not found"
              )

          block = lines[start : end + 1]
          if not any(line.strip() == "-recovery" for line in block):
              raise SystemExit(
                  "recovery exemption missing from system_data_file "
                  "write neverallow"
              )

          print(
              "Verified recovery exemption in system_data_file "
              "write neverallow"
          )
          PY

      - name: Install the donor clang revision
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf workspace/prebuilts/clang/host/linux-x86
          git clone --depth=1 --branch android-7.0.0_r21 \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            workspace/prebuilts/clang/host/linux-x86
          test -x workspace/prebuilts/clang/host/linux-x86/clang-2690385/bin/clang

      - name: Clone and validate the J720F device tree
        shell: bash
        run: |
          set -euxo pipefail
          reject_grep() {
            local label="$1"
            shift
            if grep "$@"; then
              echo "Rejected: $label" >&2
              exit 1
            else
              local status=$?
              if [ "$status" -ne 1 ]; then
                echo "grep failed while checking: $label" >&2
                exit "$status"
              fi
            fi
          }
          rm -rf "workspace/$DEVICE_PATH"
          git clone --depth=1 --branch "${{ inputs.DEVICE_TREE_BRANCH }}" \
            "${{ inputs.DEVICE_TREE }}" \
            "workspace/$DEVICE_PATH"
          cd "workspace/$DEVICE_PATH"
          echo "DEVICE_TREE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          test -x tools/audit_recovery.py
          test -x tools/finalize_samsung_recovery.py
          grep -Fq 'EXPECTED_KERNEL_SHA256 = "d33cf9471a60e8a3235a656bd949b18b1d0805945cc3072f463274bfe23f8a93"' tools/audit_recovery.py
          grep -Fq 'ADB_EXEC_CRED_OFFSET = 0x154D18' tools/audit_recovery.py
          grep -Fq 'DEFEX_EXECVE_SELECTOR_OFFSET = 0x154524' tools/audit_recovery.py
          grep -Fq 'OTHER_ADB_ROOT_OFFSET = 0x2F47D4' tools/audit_recovery.py
          test -f prebuilt/kernel
          test -f prebuilt/dt.img
          test -f prebuilt/samsung-recovery-trailer.bin

          echo \
            'f91660e294f4532d266d23f386f99f4e9c290859154236d82e5280af9f11d268  prebuilt/kernel' \
            | sha256sum -c -
          echo \
            '25fd9f99fcb520b117475c812302afdfd53f8f36dbcda6a9416429b2401ddafb  prebuilt/dt.img' \
            | sha256sum -c -
          grep -Fq 'TW_USE_NEW_MINADBD := true' BoardConfig.mk
          grep -Fq 'TW_INCLUDE_CRYPTO := true' BoardConfig.mk
          grep -Fq 'TW_EXCLUDE_MTP := true' BoardConfig.mk
          grep -Fq 'TW_DEFAULT_EXTERNAL_STORAGE := true' BoardConfig.mk
          grep -Fq 'BOARD_SEPOLICY_DIRS += device/samsung/j7duolte/sepolicy' BoardConfig.mk
          reject_grep 'TW_INCLUDE_FBE remains enabled' -q 'TW_INCLUDE_FBE' BoardConfig.mk
          reject_grep 'system vold crypto remains enabled' -q 'TW_CRYPTO_USE_SYSTEM_VOLD' BoardConfig.mk

          grep -q '^/external_sd vfat /dev/block/mmcblk1p1 /dev/block/mmcblk1' recovery.fstab
          grep -q '^/data[[:space:]].*length=-20480' recovery.fstab
          reject_grep 'rejected legacy crypto footer remains' -q 'encryptable=footer' recovery.fstab
          grep -q '^/efs[[:space:]]\+emmc' recovery.fstab
          grep -q '^/cpefs[[:space:]]\+emmc' recovery.fstab
          grep -q '^/misc[[:space:]]\+emmc.*backup=1' recovery.fstab

          grep -q 'allow recovery vfat:file create_file_perms;' sepolicy/recovery.te
          grep -q 'allow recovery self:netlink_kobject_uevent_socket create_socket_perms;' sepolicy/recovery.te
          reject_grep 'device policy makes init or recovery permissive' -Rq '^permissive \(init\|recovery\);' sepolicy
          reject_grep 'device policy makes adbd permissive' -q '^permissive adbd;' sepolicy/adbd.te
          grep -q 'allow init configfs:file create_file_perms;' sepolicy/init.te
          grep -q 'allow init functionfs:filesystem' sepolicy/init.te
          grep -q 'allow init sysfs_usb:file rw_file_perms;' sepolicy/init.te
          grep -q 'allow adbd functionfs:file rw_file_perms;' sepolicy/adbd.te
          grep -q 'set_prop(adbd, ffs_prop)' sepolicy/adbd.te
          grep -q 'get_prop(adbd, twrp_prop)' sepolicy/adbd.te
          grep -q 'allow adbd rootfs:file rx_file_perms;' sepolicy/adbd.te
          grep -q 'allow adbd self:process setcurrent;' sepolicy/adbd.te
          reject_grep 'superseded adbd su dyntransition remains' -q 'allow adbd su:process dyntransition;' sepolicy/adbd.te
          reject_grep 'superseded su inherited fd rule remains' -q 'allow su adbd:fd use;' sepolicy/adbd.te
          reject_grep 'superseded su inherited socket rule remains' -q 'allow su adbd:unix_stream_socket' sepolicy/adbd.te
          grep -q 'allow adbd recovery:process dyntransition;' sepolicy/adbd.te
          grep -q 'allow recovery adbd:fd use;' sepolicy/adbd.te
          grep -q 'allow recovery adbd:unix_stream_socket { read write ioctl getattr };' sepolicy/adbd.te
          reject_grep 'superseded adbd shell domain transition remains' -q 'domain_trans(adbd, rootfs, shell)' sepolicy/adbd.te
          reject_grep 'superseded adbd shell dyntransition remains' -q 'allow adbd shell:process dyntransition;' sepolicy/adbd.te
          reject_grep 'superseded adbd shell noatsecure remains' -q 'allow adbd shell:process noatsecure;' sepolicy/adbd.te
          reject_grep 'superseded shell rootfs execute rule remains' -q 'allow shell rootfs:file rx_file_perms;' sepolicy/adbd.te
          reject_grep 'superseded shell inherited fd rule remains' -q 'allow shell adbd:fd use;' sepolicy/adbd.te
          reject_grep 'superseded shell inherited socket rule remains' -q 'allow shell adbd:unix_stream_socket' sepolicy/adbd.te
          reject_grep 'adbd still has generic tmpfs write access' -q 'allow adbd tmpfs:' sepolicy/adbd.te
          grep -q 'type j720f_adbd_trace_file, file_type;' sepolicy/j720f_trace.te
          grep -q 'allow adbd j720f_adbd_trace_file:file create_file_perms;' sepolicy/j720f_trace.te
          grep -q 'allow recovery j720f_adbd_trace_file:file r_file_perms;' sepolicy/j720f_trace.te
          grep -Fq '/tmp/J720F_ADBD_USB_TRACE\.txt' sepolicy/file_contexts
          grep -Fq '/tmp/J720F_ADBD_TRACE\.txt' sepolicy/file_contexts
          grep -q 'allow recovery system_data_file:dir create_dir_perms;' sepolicy/recovery.te
          grep -q 'allow recovery system_data_file:file create_file_perms;' sepolicy/recovery.te
          grep -q 'allow recovery media_rw_data_file:dir create_dir_perms;' sepolicy/recovery.te
          grep -q 'allow recovery media_rw_data_file:file create_file_perms;' sepolicy/recovery.te
          test ! -e sepolicy/su.te
          reject_grep 'legacy adb_device character-device rule remains' -q 'adb_device:chr_file' sepolicy/adbd.te
          grep -q 'allow recovery tmpfs:fifo_file create_file_perms;' sepolicy/recovery.te
          grep -q 'create_pty(recovery)' sepolicy/recovery.te
          grep -q 'set_prop(recovery, twrp_prop)' sepolicy/recovery.te
          grep -q 'set_prop(recovery, system_radio_prop)' sepolicy/recovery.te
          grep -q 'type twrp_prop, property_type;' sepolicy/property.te
          grep -Eq '^j720f\.[[:space:]]+u:object_r:twrp_prop:s0$' sepolicy/property_contexts
          grep -q '^ro.twrp\.' sepolicy/property_contexts
          grep -q '^twrp\.' sepolicy/property_contexts

          test -f recovery/root/init.rc
          reject_grep 'obsolete permissive helper remains in init.rc' -q '/sbin/permissive.sh' recovery/root/init.rc
          reject_grep 'absent vold decrypt rc is still imported' -q 'init.recovery.vold_decrypt.rc' recovery/root/init.rc
          reject_grep 'legacy adb root restart trigger remains' -q 'on property:service.adb.root=1' recovery/root/init.rc
          reject_grep 'generic debuggable trigger can still start adbd early' -q 'on property:ro.debuggable=1' recovery/root/init.rc
          reject_grep 'generic init.rc can still enable android_usb' -q 'write /sys/class/android_usb/android0/enable 1' recovery/root/init.rc
          grep -q 'service adbd /sbin/adbd --device_banner=recovery' recovery/root/init.rc
          reject_grep 'whole-daemon root_seclabel remains' -Eq '^[[:space:]]*service[[:space:]]+adbd[[:space:]].*--root_seclabel=' recovery/root/init.rc
          reject_grep 'Android 10 adbd library path remains' -q 'setenv LD_LIBRARY_PATH /system/lib64' recovery/root/init.rc
          grep -q 'setprop j720f.usb.native_prepare 1' recovery/root/init.rc

          test -L recovery/root/etc/fstab
          test "$(readlink recovery/root/etc/fstab)" = /tmp/fstab
          test -x recovery/root/sbin/j720f_runtime_diag.sh
          test -x recovery/root/sbin/j720f_collect_direct_usb_trace.sh
          test ! -e recovery/root/sbin/postrecoveryboot.sh
          test ! -e recovery/root/sbin/j720f_rc231_diag.sh
          test ! -e recovery/root/sbin/j720f_usb_report.sh

          grep -q 'mount configfs none /sys/kernel/config' recovery/root/init.recovery.usb.rc
          grep -q 'mount functionfs adb /dev/usb-ffs/adb uid=0,gid=0' recovery/root/init.recovery.usb.rc
          reject_grep 'FunctionFS endpoints are still shell-owned while adbd runs as root' -q 'mount functionfs adb /dev/usb-ffs/adb uid=2000,gid=2000' recovery/root/init.recovery.usb.rc
          grep -q '/sys/kernel/config/usb_gadget/g1/functions/ffs.adb' recovery/root/init.recovery.usb.rc
          grep -q '/sys/kernel/config/usb_gadget/g1/configs/c.1/ffs.adb' recovery/root/init.recovery.usb.rc
          grep -q 'on property:sys.usb.config=adb && property:sys.usb.ffs.ready=1' recovery/root/init.recovery.usb.rc
          grep -q 'write /sys/kernel/config/usb_gadget/g1/UDC ${sys.usb.controller}' recovery/root/init.recovery.usb.rc
          grep -q 'setprop j720f.usb.transport native-android71-ffs' recovery/root/init.recovery.usb.rc
          grep -q 'setprop j720f.usb.adbd_domain_only 1' recovery/root/init.recovery.usb.rc
          grep -q 'setprop j720f.usb.direct_trace 1' recovery/root/init.recovery.usb.rc
          grep -q 'setprop j720f.usb.pure_configfs 0' recovery/root/init.recovery.usb.rc
          grep -q 'setprop j720f.usb.stock_android_usb_gate 1' recovery/root/init.recovery.usb.rc
          grep -q 'setprop j720f.usb.stock_link_order 1' recovery/root/init.recovery.usb.rc
          grep -q 'setprop persist.adb.trace_mask all' recovery/root/init.recovery.usb.rc
          grep -q 'write /tmp/J720F_ADBD_USB_TRACE.txt J720F_USB_DIAG_INIT_PRECREATED' recovery/root/init.recovery.usb.rc
          grep -q 'restorecon /tmp/J720F_ADBD_USB_TRACE.txt' recovery/root/init.recovery.usb.rc
          grep -q 'write /tmp/J720F_ADBD_TRACE.txt J720F_ADBD_TRACE_INIT_PRECREATED' recovery/root/init.recovery.usb.rc
          grep -q 'restorecon /tmp/J720F_ADBD_TRACE.txt' recovery/root/init.recovery.usb.rc
          grep -q 'setprop j720f.usb.trace_precreated 1' recovery/root/init.recovery.usb.rc
          grep -q 'setprop j720f.usb.ffs_mount_action 1' recovery/root/init.recovery.usb.rc
          grep -q 'setprop j720f.usb.configfs_bind 1' recovery/root/init.recovery.usb.rc
          grep -q 'setprop j720f.usb.udc_bind_action 1' recovery/root/init.recovery.usb.rc
          grep -q 'setprop j720f.usb.configfs_action 1' recovery/root/init.recovery.usb.rc
          python3 - <<'PY_CHECK'
          from pathlib import Path

          usb = Path("recovery/root/init.recovery.usb.rc").read_text()
          trigger = (
              "on property:sys.usb.config=adb && property:sys.usb.ffs.ready=1 "
              "&& property:sys.usb.configfs=1"
          )
          mount = "mount functionfs adb /dev/usb-ffs/adb uid=0,gid=0"
          link = (
              "symlink /sys/kernel/config/usb_gadget/g1/functions/ffs.adb "
              "/sys/kernel/config/usb_gadget/g1/configs/c.1/ffs.adb"
          )
          if usb.count(link) != 1:
              raise SystemExit("expected exactly one ConfigFS ffs.adb link")
          link_index = usb.find(link)
          mount_index = usb.find(mount)
          trigger_index = usb.find(trigger)
          if min(link_index, mount_index, trigger_index) < 0 or not (
              link_index < mount_index < trigger_index
          ):
              raise SystemExit(
                  "ffs.adb must be linked before FunctionFS is mounted and kept "
                  "through the ffs.ready bind action"
              )
          if "rm /sys/kernel/config/usb_gadget/g1/configs/c.1/ffs.adb" in usb:
              raise SystemExit("USB none action must not remove the stock-order ffs.adb link")
          if "j720f.usb.pure_configfs_bind_action" in usb:
              raise SystemExit("overlength Android 7 property name remains")

          stock_gate = [
              "write /sys/class/android_usb/android0/enable 0",
              "write /sys/class/android_usb/android0/f_ffs/aliases adb",
              "write /sys/class/android_usb/android0/functions adb",
              "write /sys/class/android_usb/android0/enable 1",
          ]
          android_usb_lines = [
              line.strip() for line in usb.splitlines()
              if "/sys/class/android_usb/android0/" in line
          ]
          if android_usb_lines != stock_gate:
              raise SystemExit(
                  "expected exactly the four CUL1 stock android_usb gate writes; "
                  f"found: {android_usb_lines}"
              )

          udc_bind = "write /sys/kernel/config/usb_gadget/g1/UDC ${sys.usb.controller}"
          ordered = [trigger] + stock_gate[:3] + [udc_bind, stock_gate[3]]
          indices = [usb.find(item) for item in ordered]
          if min(indices) < 0 or indices != sorted(indices) or len(set(indices)) != len(indices):
              raise SystemExit(
                  "CUL1 android_usb gate must wrap the ConfigFS UDC bind in stock order"
              )

          print("Verified Samsung stock-order ConfigFS/FunctionFS registration and android_usb UDC gate")
          PY_CHECK
          if grep -q 'functions/adb.0\|configs/c.1/adb.0\|/dev/android_adb' recovery/root/init.recovery.usb.rc; then
            echo 'Rejected direct legacy ADB route remains' >&2
            exit 1
          fi
          if grep -q '/sys/fs/selinux/enforce\|/sbin/permissive.sh' recovery/root/init.recovery.usb.rc; then
            echo 'Late permissive workaround remains' >&2
            exit 1
          fi
          if grep -qi 'mtp' recovery/root/init.recovery.usb.rc; then
            echo 'MTP must remain isolated in this ADB transport test' >&2
            exit 1
          fi
          grep -Eq '^/dev/usb-ffs/adb/ep0[[:space:]]+0600[[:space:]]+root[[:space:]]+root$' recovery/root/ueventd.samsungexynos7885.rc
          grep -Eq '^/dev/usb-ffs/adb/ep1[[:space:]]+0600[[:space:]]+root[[:space:]]+root$' recovery/root/ueventd.samsungexynos7885.rc
          grep -Eq '^/dev/usb-ffs/adb/ep2[[:space:]]+0600[[:space:]]+root[[:space:]]+root$' recovery/root/ueventd.samsungexynos7885.rc
          grep -q 'service j7diag /sbin/sh /sbin/j720f_runtime_diag.sh' recovery/root/init.recovery.usb.rc
          grep -q 'group root shell readproc' recovery/root/init.recovery.usb.rc
          grep -q 'seclabel u:r:recovery:s0' recovery/root/init.recovery.usb.rc
          grep -q 'start j7diag' recovery/root/init.recovery.usb.rc
          grep -q 'J720F_RUNTIME_DIAGNOSTICS.txt' recovery/root/sbin/j720f_runtime_diag.sh
          grep -q 'NATIVE ANDROID 7.1 RECOVERY ADBD' recovery/root/sbin/j720f_runtime_diag.sh
          grep -q 'ADBD PROCESS / CONTEXT / FDS' recovery/root/sbin/j720f_runtime_diag.sh
          grep -q 'pidof adbd' recovery/root/sbin/j720f_runtime_diag.sh
          grep -q 'DIRECT ADBD FUNCTIONFS SYSCALL TRACE' recovery/root/sbin/j720f_runtime_diag.sh
          grep -q '/tmp/J720F_ADBD_USB_TRACE.txt' recovery/root/sbin/j720f_runtime_diag.sh
          grep -q '/tmp/J720F_ADBD_TRACE.txt' recovery/root/sbin/j720f_runtime_diag.sh
          grep -q 'j720f_collect_direct_usb_trace.sh auto' recovery/root/sbin/j720f_runtime_diag.sh
          grep -q 'J720F_DIRECT_USB_TRACE' recovery/root/sbin/j720f_collect_direct_usb_trace.sh
          grep -q 'trace_metadata.txt' recovery/root/sbin/j720f_collect_direct_usb_trace.sh
          grep -q 'data_access.txt' recovery/root/sbin/j720f_collect_direct_usb_trace.sh
          reject_grep 'diagnostic script still searches for /sbin/twrp' -q '/sbin/twrp' recovery/root/sbin/j720f_runtime_diag.sh
          reject_grep 'diagnostic script still performs a mount' -q 'mount -t' recovery/root/sbin/j720f_runtime_diag.sh
          reject_grep 'diagnostic script still stops services' -q 'ctl.stop' recovery/root/sbin/j720f_runtime_diag.sh
          reject_grep 'diagnostic script still starts services' -q 'ctl.start' recovery/root/sbin/j720f_runtime_diag.sh
          reject_grep 'collector performs a mount' -q 'mount -t' recovery/root/sbin/j720f_collect_direct_usb_trace.sh
          reject_grep 'collector stops services' -q 'ctl.stop' recovery/root/sbin/j720f_collect_direct_usb_trace.sh
          reject_grep 'collector starts services' -q 'ctl.start' recovery/root/sbin/j720f_collect_direct_usb_trace.sh

      - name: Build source TWRP 3.3 in the proven donor environment
        shell: bash
        run: |
          set -euxo pipefail
          docker pull yshalsager/lineageos:14.1
          docker run --rm -i \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/twrp-home \
            -e USER="$(id -un)" \
            -e LOGNAME="$(id -un)" \
            -v /etc/passwd:/etc/passwd:ro \
            -v /etc/group:/etc/group:ro \
            -v "$GITHUB_WORKSPACE/workspace:/home/twrp:rw" \
            -w /home/twrp \
            yshalsager/lineageos:14.1 bash <<'BUILD_EOF'
          # Android 7.1's envsetup.sh is not compatible with Bash nounset (-u).
          set -eo pipefail
          set +u
          set -x
          reject_grep() {
            local label="$1"
            shift
            if grep "$@"; then
              echo "Rejected: $label" >&2
              exit 1
            else
              local status=$?
              if [ "$status" -ne 1 ]; then
                echo "grep failed while checking: $label" >&2
                exit "$status"
              fi
            fi
          }
          mkdir -p "$HOME"
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_j7duolte-eng
          make -j"$(nproc)" recoveryimage

          OUT=out/target/product/j7duolte
          POLICY_CONF="$OUT/obj/ETC/sepolicy.recovery_intermediates/policy_recovery.conf"
          RECOVERY_POLICY="$OUT/obj/ETC/sepolicy.recovery_intermediates/sepolicy.recovery"
          ROOT_POLICY="$OUT/recovery/root/sepolicy"
          ANALYZE=out/host/linux-x86/bin/sepolicy-analyze

          test -f "$OUT/recovery.img"
          test -f "$POLICY_CONF"
          test -f "$RECOVERY_POLICY"
          test -f "$ROOT_POLICY"
          test -x "$ANALYZE"
          reject_grep 'compiled policy makes init permissive' -Eq '^[[:space:]]*permissive[[:space:]]+init;' "$POLICY_CONF"
          grep -Fq 'type twrp_prop, property_type;' "$POLICY_CONF"
          grep -E '^(allow|dontaudit) adbd (functionfs|ffs_prop|twrp_prop|tmpfs|rootfs|j720f_adbd_trace_file)' "$POLICY_CONF" \
            | tee "$OUT/sepolicy-adbd-usb-rules.txt"
          grep -E '^allow (init|adbd|recovery) (j720f_adbd_trace_file|system_data_file|media_rw_data_file)' "$POLICY_CONF" \
            | tee "$OUT/sepolicy-j720f-data-trace-rules.txt"
          grep -q '^allow adbd functionfs:file {' "$POLICY_CONF"
          grep -q '^allow adbd ffs_prop:property_service set;' "$POLICY_CONF"
          grep -q '^allow adbd twrp_prop:file ' "$POLICY_CONF"
          grep -Eq '^allow adbd rootfs:file .*execute_no_trans' "$POLICY_CONF"
          echo 'Verified compiled adbd rootfs execute_no_trans permission for /sbin recovery shell'
          grep -q '^allow adbd self:process setcurrent;' "$POLICY_CONF"
          grep -Eq '^allow adbd recovery:process .*dyntransition' "$POLICY_CONF"
          grep -q '^allow adbd self:process setexec;' "$POLICY_CONF"
          grep -Eq '^allow adbd recovery:process .*[[:space:]{}]transition([[:space:]{};]|$)' "$POLICY_CONF"
          grep -Eq '^allow adbd recovery:process .*siginh' "$POLICY_CONF"
          grep -Eq '^allow adbd recovery:process .*rlimitinh' "$POLICY_CONF"
          grep -Eq '^dontaudit adbd recovery:process .*noatsecure' "$POLICY_CONF"
          grep -q '^allow recovery rootfs:file entrypoint;' "$POLICY_CONF"
          grep -Eq '^allow recovery devpts:chr_file .*open' "$POLICY_CONF"
          grep -Eq '^allow recovery devpts:chr_file .*read' "$POLICY_CONF"
          grep -Eq '^allow recovery devpts:chr_file .*write' "$POLICY_CONF"
          grep -Eq '^allow recovery devpts:chr_file .*ioctl' "$POLICY_CONF"
          grep -Eq '^allow recovery adbd:process .*sigchld' "$POLICY_CONF"
          grep -Eq '^allow adbd recovery:process .*signal' "$POLICY_CONF"
          grep -q '^allow recovery adbd:fd use;' "$POLICY_CONF"
          grep -q '^allow recovery adbd:unix_stream_socket ' "$POLICY_CONF"
          echo 'Verified compiled raw/PTY/sync child-only adbd -> recovery transitions, lifecycle signaling and inherited I/O permissions'
          if grep -E '^allow adbd tmpfs:.*[[:space:]{}](create|write|append|setattr|unlink|rename|add_name|remove_name|reparent|rmdir|relabelfrom|relabelto|execute|execute_no_trans|entrypoint|mounton)([[:space:]{};]|$)' "$POLICY_CONF"; then
            echo 'Rejected: compiled policy grants generic adbd tmpfs write or execute access' >&2
            exit 1
          fi
          echo 'Verified: adbd has no generic tmpfs write or execute access'
          grep -q '^allow adbd j720f_adbd_trace_file:file ' "$POLICY_CONF"
          grep -q '^allow recovery j720f_adbd_trace_file:file ' "$POLICY_CONF"
          grep -q '^allow recovery system_data_file:dir ' "$POLICY_CONF"
          grep -q '^allow recovery system_data_file:file ' "$POLICY_CONF"
          grep -q '^allow recovery media_rw_data_file:dir ' "$POLICY_CONF"
          grep -q '^allow recovery media_rw_data_file:file ' "$POLICY_CONF"
          reject_grep 'compiled recovery data neverallow remains' -q '^neverallow recovery data_file_type:' "$POLICY_CONF"
          reject_grep 'compiled policy still grants su FunctionFS access' -q '^allow su functionfs:' "$POLICY_CONF"
          reject_grep 'compiled policy still lets su set ffs_prop' -q '^allow su ffs_prop:property_service set;' "$POLICY_CONF"
          "$ANALYZE" "$RECOVERY_POLICY" permissive \
            | tee "$OUT/sepolicy-permissive-domains.txt"
          if grep -Eq '^(adbd|init)$' "$OUT/sepolicy-permissive-domains.txt"; then
            echo 'init/adbd must remain enforcing domains' >&2
            exit 1
          fi
          if ! grep -qx 'recovery' "$OUT/sepolicy-permissive-domains.txt"; then
            echo 'donor recovery domain unexpectedly stopped being permissive' >&2
            exit 1
          fi
          echo 'Verified: parent adbd/init enforce SELinux; command-child target recovery is donor-permissive'
          cmp "$RECOVERY_POLICY" "$ROOT_POLICY"
          if grep -aFq 'J720F recovery: forcing SELinux permissive' "$OUT/recovery/root/init"; then
            echo 'Disproven forced-permissive init patch remains' >&2
            exit 1
          fi
          test -x "$OUT/recovery/root/sbin/adbd"
          test -x "$OUT/recovery/root/sbin/busybox"
          test -L "$OUT/recovery/root/sbin/sh"
          test "$(readlink "$OUT/recovery/root/sbin/sh")" = busybox
          grep -aFq '/dev/usb-ffs/adb/ep0' "$OUT/recovery/root/sbin/adbd"
          grep -aFq '/dev/usb-ffs/adb/ep1' "$OUT/recovery/root/sbin/adbd"
          grep -aFq '/dev/usb-ffs/adb/ep2' "$OUT/recovery/root/sbin/adbd"
          grep -aFq 'sys.usb.ffs.ready' "$OUT/recovery/root/sbin/adbd"
          grep -aFq '/tmp/J720F_ADBD_USB_TRACE.txt' "$OUT/recovery/root/sbin/adbd"
          grep -aFq 'J720F_USB_DIAG' "$OUT/recovery/root/sbin/adbd"
          grep -aFq 'J720F_MAIN_USB_GATE' "$OUT/recovery/root/sbin/adbd"
          grep -aFq 'J720F_MAIN_USB_DECISION' "$OUT/recovery/root/sbin/adbd"
          grep -aFq 'event=usb_init_transport' "$OUT/recovery/root/sbin/adbd"
          grep -aFq 'event=usb_init_choice' "$OUT/recovery/root/sbin/adbd"
          grep -aFq 'event=v2_descriptor_write' "$OUT/recovery/root/sbin/adbd"
          grep -aFq 'event=ffs_ready_property_set' "$OUT/recovery/root/sbin/adbd"
          grep -aFq '/tmp/J720F_ADBD_TRACE.txt' "$OUT/recovery/root/sbin/adbd"
          grep -aFq 'J720F_SHELL_CHILD phase=pre_setcon_recovery' "$OUT/recovery/root/sbin/adbd"
          grep -aFq 'post_setcon_recovery' "$OUT/recovery/root/sbin/adbd"
          grep -aFq 'J720F_CHILD_RECOVERY_SELCON failed' "$OUT/recovery/root/sbin/adbd"
          grep -aFq 'J720F PTY setexeccon' "$OUT/recovery/root/sbin/adbd"
          grep -aFq 'phase=pty_setexec_recovery_pending' "$OUT/recovery/root/sbin/adbd"
          grep -aFq 'post_setexec_recovery_pending' "$OUT/recovery/root/sbin/adbd"
          grep -aFq 'J720F_ADB_SYNC_WORKER' "$OUT/recovery/root/sbin/adbd"
          grep -aFq 'J720F_ADB_SYNC_FD' "$OUT/recovery/root/sbin/adbd"
          grep -aFq 'J720F adb command child lost root before recovery setcon' "$OUT/recovery/root/sbin/adbd"
          grep -aFq 'J720F adb child lost UID/GID 0 before exec' "$OUT/recovery/root/sbin/adbd"
          grep -aFq 'J720F /sbin/sh is not executable before adb child exec' "$OUT/recovery/root/sbin/adbd"
          reject_grep 'built adbd still contains child su handoff' -aFq 'J720F_CHILD_SU_SELCON failed' "$OUT/recovery/root/sbin/adbd"
          grep -Fq 'service adbd /sbin/adbd --device_banner=recovery' "$OUT/recovery/root/init.rc"
          reject_grep 'built ramdisk still moves whole adbd daemon to root_seclabel' -Eq '^[[:space:]]*service[[:space:]]+adbd[[:space:]].*--root_seclabel=' "$OUT/recovery/root/init.rc"
          grep -aFq 'J720F_LINKER_DIAG' "$OUT/recovery/root/sbin/linker64"
          grep -aFq 'J720F_LINKER_CRED' "$OUT/recovery/root/sbin/linker64"
          grep -aFq 'J720F_INIT_UDC' "$OUT/recovery/root/init"
          grep -aFq 'J720F_UDC_CONTROL' "$OUT/recovery/root/init"
          grep -aFq 'J720F_UEVENT_SELECTOR' "$OUT/recovery/root/init"
          grep -aFq 'Function FS Gadget' "$OUT/recovery/root/init"
          grep -aFq 'acm_same_g1' "$OUT/recovery/root/init"
          reject_grep 'instrumented adbd still embeds /data ADB trace path' -aFq '/data/adb/adb-' "$OUT/recovery/root/sbin/adbd"
          test ! -e "$OUT/recovery/root/system/bin/adbd"
          test ! -e "$OUT/recovery/root/system/bin/linker64"
          test ! -e "$OUT/recovery/root/system/lib64/libadbd.so"
          grep -aFq '/tmp/orsin' "$OUT/recovery/root/sbin/recovery"
          grep -aFq '/tmp/orsout' "$OUT/recovery/root/sbin/recovery"
          reject_grep 'recovery binary still embeds /sbin/orsin' -aFq '/sbin/orsin' "$OUT/recovery/root/sbin/recovery"
          reject_grep 'recovery binary still embeds /sbin/orsout' -aFq '/sbin/orsout' "$OUT/recovery/root/sbin/recovery"
          BUILD_EOF

      - name: Finalize Samsung image and audit
        shell: bash
        run: |
          set -euxo pipefail
          TREE="workspace/$DEVICE_PATH"
          OUT="workspace/out/target/product/$DEVICE_NAME"
          IMAGE="$OUT/recovery.img"

          test -f "$IMAGE"
          test -x tools/patch_j720f_recovery_kernel_defex.py
          python3 tools/patch_j720f_recovery_kernel_defex.py "$IMAGE" \
            --report workspace/j720f-build-diagnostics/kernel-defex-patch-report.json
          python3 "$TREE/tools/finalize_samsung_recovery.py" "$IMAGE"
          python3 "$TREE/tools/audit_recovery.py" "$IMAGE" \
            --tree "$TREE" \
            --out-dir "$OUT/recovery-audit"
          cp "$OUT/sepolicy-permissive-domains.txt" \
            "$OUT/recovery-audit/sepolicy-permissive-domains.txt"
          cp "$OUT/sepolicy-adbd-usb-rules.txt" \
            "$OUT/recovery-audit/sepolicy-adbd-usb-rules.txt"
          cp "$OUT/sepolicy-j720f-data-trace-rules.txt" \
            "$OUT/recovery-audit/sepolicy-j720f-data-trace-rules.txt"
          cp workspace/j720f-build-diagnostics/* \
            "$OUT/recovery-audit/"
          test "$(stat -c %s "$IMAGE")" -le "$RECOVERY_LIMIT"

      - name: Package Heimdall/Odin tar and metadata
        shell: bash
        run: |
          set -euxo pipefail
          OUT="workspace/out/target/product/$DEVICE_NAME"
          (
            cd "$OUT"
            tar -cf recovery.tar recovery.img
          )
          {
            echo 'architecture=source-built Android 7.1 donor-era TWRP userspace'
            echo 'base=v11 UI/touch with working data access and fully initialized native FunctionFS adbd'
            echo 'diagnostic=working USB/ADB transport plus raw/PTY shell and isolated sync-worker credential/context traces'
            echo 'recovery_kernel=exact CUL1 stock kernel with proven recovery-only /sbin/adbd exec credential downgrade neutralized'
            echo 'twrp_version=3.3.0-0'
            echo "recovery_source_repository=$RECOVERY_SOURCE_REPOSITORY"
            echo "recovery_source_commit=$RECOVERY_SOURCE_COMMIT"
            echo "system_core_repository=$SYSTEM_CORE_REPOSITORY"
            echo "system_core_commit=$SYSTEM_CORE_COMMIT"
            echo "bionic_repository=$BIONIC_REPOSITORY"
            echo "bionic_commit=$BIONIC_COMMIT"
            echo "device_tree=${{ inputs.DEVICE_TREE }}"
            echo "device_tree_branch=${{ inputs.DEVICE_TREE_BRANCH }}"
            echo "device_tree_commit=$DEVICE_TREE_COMMIT"
            echo 'stock_base_assembly=false'
          } > "$OUT/build-metadata.txt"

          (
            cd "$OUT"
            sha256sum recovery.img recovery.tar > SHA256SUMS.txt
          )

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: j7duolte-twrp-3.3-native-ffs-force-ffs-entry-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            workspace/out/target/product/j7duolte/recovery.img
            workspace/out/target/product/j7duolte/recovery.tar
            workspace/out/target/product/j7duolte/build-metadata.txt
            workspace/out/target/product/j7duolte/SHA256SUMS.txt
            workspace/out/target/product/j7duolte/recovery-audit/**

      - name: Publish GitHub prerelease
        if: ${{ inputs.PUBLISH_RELEASE }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          OUT="workspace/out/target/product/$DEVICE_NAME"
          TAG="j7duolte-twrp-3.3-native-ffs-force-ffs-entry-${{ github.run_id }}"
          gh release create "$TAG" \
            "$OUT/recovery.img" \
            "$OUT/recovery.tar" \
            "$OUT/build-metadata.txt" \
            "$OUT/SHA256SUMS.txt" \
            "$OUT/recovery-audit/audit.json" \
            --repo "$GITHUB_REPOSITORY" \
            --title "J720F TWRP 3.3 UDC ACM control diagnostic ${{ github.run_id }}" \
            --notes "Diagnostic build: PID 1 records the exact failed g1/UDC bind and, only after the known ffs.adb EINVAL, performs one temporary ConfigFS CDC ACM bind against the same DWC3 UDC, records the result, unbinds and cleans it up. This isolates FunctionFS/composite failure from lower DWC3/UDC failure. Working /data and native FunctionFS adbd are retained. MTP remains excluded. Not a stable community release." \
            --prerelease
