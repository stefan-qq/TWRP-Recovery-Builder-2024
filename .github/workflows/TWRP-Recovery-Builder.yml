name: TWRP Recovery Builder - j7duolte

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: TWRP Minimal-Manifest Branch
        required: true
        default: twrp-9.0
        type: choice
        options: [twrp-9.0]
      DEVICE_TREE:
        description: Custom Recovery Tree
        required: true
        default: https://github.com/stefan-qq/android_device_samsung_j7duolte
      DEVICE_TREE_BRANCH:
        description: Custom Recovery Tree Branch
        required: true
        default: main
      DEVICE_PATH:
        description: Device path
        required: true
        default: device/samsung/j7duolte
      DEVICE_NAME:
        description: Device codename
        required: true
        default: j7duolte
      BUILD_TARGET:
        description: Build target
        required: true
        default: recovery
        type: choice
        options: [recovery]
      LDCHECK:
        description: Recovery binary to check
        required: true
        default: sbin/recovery
      RECOVERY_TAR:
        description: Build recovery.tar for Heimdall/Odin workflows
        required: false
        default: true
        type: boolean
      RECOVERY_INSTALLER:
        description: Include generic installer zip (leave disabled during bring-up)
        required: false
        default: false
        type: boolean
      PUBLISH_RELEASE:
        description: Publish a prerelease after all audits pass
        required: false
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      DEVICE_OUT: workspace/out/target/product/j7duolte
      RECOVERY_LIMIT: '39845888'

    steps:
      - name: Check out builder
        uses: actions/checkout@v7

      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost /usr/share/swift
          sudo docker system prune -a -f || true
          df -h

      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo add-apt-repository -y universe
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl flex g++-multilib gcc-multilib \
            git git-lfs gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev \
            lib32z1-dev libbz2-dev libc6-dev-i386 libffi-dev libgdbm-dev \
            libgl1-mesa-dev liblz4-tool libncurses5 libncurses5-dev \
            libreadline-dev libsdl1.2-dev libsqlite3-dev libssl-dev \
            libxml2-utils lzma lzop openjdk-8-jdk pngcrush rsync schedtool \
            squashfs-tools tk-dev unzip uuid-dev wget x11proto-core-dev \
            xsltproc xz-utils zip zlib1g-dev

      - name: Build Python 2.7.18 for twrp-9.0
        shell: bash
        run: |
          set -euxo pipefail
          PY2_PREFIX="$RUNNER_TEMP/python-2.7.18"
          PY2_ARCHIVE="$RUNNER_TEMP/Python-2.7.18.tar.xz"
          PY2_SOURCE="$RUNNER_TEMP/Python-2.7.18"

          curl -fsSL \
            https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tar.xz \
            -o "$PY2_ARCHIVE"

          echo "fd6cc8ec0a78c44036f825e739f36e5a  $PY2_ARCHIVE" \
            | md5sum --check --strict -

          rm -rf "$PY2_SOURCE" "$PY2_PREFIX"
          tar -xJf "$PY2_ARCHIVE" -C "$RUNNER_TEMP"
          cd "$PY2_SOURCE"

          ./configure \
            --prefix="$PY2_PREFIX" \
            --with-unicode=ucs4 \
            --without-ensurepip
          make -j"$(nproc)"
          make install

          ln -sfn python2.7 "$PY2_PREFIX/bin/python"
          ln -sfn python2.7 "$PY2_PREFIX/bin/python2"

          "$PY2_PREFIX/bin/python" --version
          "$PY2_PREFIX/bin/python" -c \
            'import sys; assert sys.version_info[:2] == (2, 7)'

          echo "$PY2_PREFIX/bin" >> "$GITHUB_PATH"
          echo "PYTHON2=$PY2_PREFIX/bin/python2.7" >> "$GITHUB_ENV"

      - name: Install repo tool
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize and sync twrp-9.0
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p workspace
          cd workspace
          repo init --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git \
            -b twrp-9.0
          repo sync -c --force-sync --no-clone-bundle --no-tags -j"$(nproc)"

      - name: Clone device tree
        shell: bash
        run: |
          set -euxo pipefail
          cd workspace
          git clone --depth=1 --branch "${{ inputs.DEVICE_TREE_BRANCH }}" \
            "${{ inputs.DEVICE_TREE }}" "${{ inputs.DEVICE_PATH }}"
          cd "${{ inputs.DEVICE_PATH }}"
          echo "DEVICE_TREE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if grep -Rqs 'BOARD_PREBUILT_RECOVERY_RAMDISK' BoardConfig.mk; then
            echo 'ERROR: hybrid prebuilt ramdisk is still enabled' >&2
            exit 1
          fi
          for bad in recovery/root/init.rc recovery/root/ueventd.rc recovery/root/sepolicy_version; do
            if [[ -e "$bad" ]]; then
              echo "ERROR: obsolete top-level override remains: $bad" >&2
              exit 1
            fi
          done

      - name: Build source TWRP recovery
        shell: bash
        run: |
          # Android 9's envsetup.sh is not compatible with Bash nounset (-u):
          # gettop reads TOP before it has been initialized.
          set -eo pipefail
          set +u

          cd workspace

          python --version
          python3 --version
          test "$(python -c 'import sys; print("%d.%d" % sys.version_info[:2])')" = "2.7"

          export USE_CCACHE=1
          export CCACHE_EXEC="$(command -v ccache)"
          ccache -M 8G

          source build/envsetup.sh

          test -n "${ANDROID_BUILD_TOP:-}"
          echo "ANDROID_BUILD_TOP=$ANDROID_BUILD_TOP"

          lunch "omni_${{ inputs.DEVICE_NAME }}-eng"
          mka recoveryimage
          
      - name: Finalize Samsung image and audit
        shell: bash
        run: |
          set -euxo pipefail
          TREE="workspace/${{ inputs.DEVICE_PATH }}"
          IMAGE="workspace/out/target/product/${{ inputs.DEVICE_NAME }}/recovery.img"
          python3 "$TREE/tools/finalize_samsung_recovery.py" "$IMAGE"
          python3 "$TREE/tools/audit_recovery.py" "$IMAGE" \
            --tree "$TREE" \
            --out-dir "workspace/out/target/product/${{ inputs.DEVICE_NAME }}/recovery-audit"
          test "$(stat -c %s "$IMAGE")" -le "$RECOVERY_LIMIT"

      - name: Check recovery dynamic dependencies
        shell: bash
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/workspace/out/target/product/${{ inputs.DEVICE_NAME }}"
          ROOT="$OUT/recovery/root"
          REPORT_DIR="$OUT/recovery-audit"
          REPORT="$REPORT_DIR/ldcheck.txt"

          test -e "$ROOT/${{ inputs.LDCHECK }}"
          mkdir -p "$REPORT_DIR"

          cp tools/libneeds tools/ldcheck "$ROOT/"

          (
            cd "$ROOT"

            python3 ldcheck \
              -p sbin:system/bin:system/lib64:vendor/lib64:system/lib:vendor/lib \
              -d "${{ inputs.LDCHECK }}"
          ) 2>&1 | tee "$REPORT"

          test -s "$REPORT"

      - name: Package recovery.tar
        if: ${{ inputs.RECOVERY_TAR }}
        shell: bash
        run: |
          set -euxo pipefail
          cd "workspace/out/target/product/${{ inputs.DEVICE_NAME }}"
          tar -cf recovery.tar recovery.img

      - name: Record build metadata
        shell: bash
        run: |
          set -euxo pipefail
          OUT="workspace/out/target/product/${{ inputs.DEVICE_NAME }}"
          sha256sum "$OUT/recovery.img" > "$OUT/recovery.img.sha256"
          {
            echo "manifest=twrp-9.0"
            echo "device_tree=${{ inputs.DEVICE_TREE }}"
            echo "device_tree_branch=${{ inputs.DEVICE_TREE_BRANCH }}"
            echo "device_tree_commit=$DEVICE_TREE_COMMIT"
            echo "runner=${{ runner.os }}-${{ runner.arch }}"
          } > "$OUT/build-metadata.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: j7duolte-twrp-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 30
          path: |
            workspace/out/target/product/${{ inputs.DEVICE_NAME }}/recovery.img
            workspace/out/target/product/${{ inputs.DEVICE_NAME }}/recovery.img.sha256
            workspace/out/target/product/${{ inputs.DEVICE_NAME }}/recovery.tar
            workspace/out/target/product/${{ inputs.DEVICE_NAME }}/build-metadata.txt
            workspace/out/target/product/${{ inputs.DEVICE_NAME }}/recovery-audit/**

      - name: Publish GitHub prerelease
        if: ${{ inputs.PUBLISH_RELEASE }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          OUT="workspace/out/target/product/${{ inputs.DEVICE_NAME }}"
          TAG="j7duolte-${{ github.run_id }}"
          FILES=(
            "$OUT/recovery.img"
            "$OUT/recovery.img.sha256"
            "$OUT/build-metadata.txt"
            "$OUT/recovery-audit/audit.json"
            "$OUT/recovery-audit/ldcheck.txt"
          )
          if [[ -f "$OUT/recovery.tar" ]]; then
            FILES+=("$OUT/recovery.tar")
          fi
          gh release create "$TAG" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "j7duolte source-build test ${{ github.run_id }}" \
            --notes "Automated, audited TWRP bring-up build. Do not publish as stable." \
            --prerelease
